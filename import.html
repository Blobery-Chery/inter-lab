<!doctype html>
<html lang="ru" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Виртуальная лаборатория</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #edf1f3; color: #15222b;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #0e1519; color: #e2eaef; } a { color: #86a6ff; } }
  main { max-width: 520px; padding: 24px 16px; text-align: center; }
  p { margin: 6px 0; } .m { opacity: .7; font-size: 14px; }
  a { color: #0b5d4b; }
</style>
</head>
<body>
<main>
  <p><b>Переносим ваши данные на новый адрес сайта…</b></p>
  <p class="m">Деректеріңізді сайттың жаңа мекенжайына көшіріп жатырмыз… · Moving your data to the new site address…</p>
  <p class="m"><a href="./">Открыть сайт · Сайтты ашу · Open the site</a></p>
</main>
<script>
/*
 * Переезд со старого адреса сайта (blobery-chery.github.io/inter-lab/).
 * Старый адрес открывает страницу-мост, она собирает данные студента с ключами vlab_* из хранилища браузера
 * (кто он, допуски, прогресс, язык) и переходит сюда: import.html#g.<gzip+base64url> или #j.<base64url>.
 * Данные идут только в части адреса после «#» — она не уходит ни на один сервер; адрес сразу очищается.
 * Ничего не затираем: профиль студента берём, только если здесь ещё нет ФИО; допуски дописываем по недостающим
 * работам; прогресс работы — если здесь его нет или здесь сделано меньше. Ключи преподавателя не переносятся.
 */
(async function () {
  var raw = location.hash.slice(1);
  try { history.replaceState(null, '', location.pathname); } catch (e) { /* не страшно */ }
  var to = '#/';
  var flag = '';
  try {
    var data = await decode(raw);
    if (data && data.v === 1 && data.ls && typeof data.ls === 'object') {
      if (typeof data.to === 'string' && /^#\/[\w\-\/]*$/.test(data.to)) to = data.to;
      var n = 0;
      Object.keys(data.ls).forEach(function (k) {
        var v = data.ls[k];
        if (!/^vlab_/.test(k) || /^vlab_teacher/.test(k) || typeof v !== 'string' || v.length >= 5e6) return;
        var cur = localStorage.getItem(k);
        if (k === 'vlab_api_student') {
          if (!named(cur) && named(v)) { localStorage.setItem(k, v); n++; }
        } else if (k === 'vlab_api_admissions') {
          var a = parse(cur) || {}, b = parse(v) || {}, add = 0;
          Object.keys(b).forEach(function (lab) { if (!a[lab]) { a[lab] = b[lab]; add++; } });
          if (add) { localStorage.setItem(k, JSON.stringify(a)); n++; }
        } else if (/^vlab_lab_/.test(k)) {
          if (cur == null || score(parse(v)) > score(parse(cur))) { localStorage.setItem(k, v); n++; }
        } else if (cur == null) { localStorage.setItem(k, v); n++; }
      });
      flag = n ? 'ok' : 'skip';
    }
  } catch (e) { flag = flag || ''; }
  try { if (flag) sessionStorage.setItem('vlab_moved', flag); } catch (e) { /* без уведомления */ }
  location.replace('./' + to);

  function parse(s) { try { return JSON.parse(s); } catch (e) { return null; } }
  function named(s) { var o = parse(s); return !!(o && o.name); }
  // как в app/sync.js: завершённый опыт = 1000, иначе номер шага; сданный протокол — сверху
  function score(p) {
    if (!p || !p.runs) return 0;
    var t = 0;
    Object.keys(p.runs).forEach(function (k) { var r = p.runs[k]; t += r && r.status === 'done' ? 1000 : ((r && r.step) || 0) + 1; });
    return t + (p.report && p.report.sentAt ? 100000 : 0);
  }
  async function decode(s) {
    if (!s || s.length < 3) return null;
    var kind = s.slice(0, 2), b64 = s.slice(2).replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (kind === 'g.') {
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return JSON.parse(await new Response(stream).text());
    }
    if (kind === 'j.') return JSON.parse(new TextDecoder().decode(bytes));
    return null;
  }
})();
</script>
</body>
</html>
