<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual lab: benzoic acid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e9eff3; --surface: #ffffff; --surface-2: #f4f7f9; --ink: #1f252c; --muted: #5b6672; --line: #d2dbe2;
  --carbon: #4a525c; --oxygen: #d7263d; --iodine: #5b3e96; --iodine-soft: #ece6f7;
  --action: #1f5faf; --action-soft: #dde9f8; --on-action: #ffffff;
  --ok: #1e8a5a; --ok-soft: #dcf2e7; --bad: #a8480a; --bad-soft: #fbe9dc;
  --glass: rgba(255,255,255,0.7); --glass-line: #7f8d99; --heat: #e0662e; --ice: rgba(110,170,225,0.22); --ice-line: rgba(80,140,200,0.55);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --surface: #1a2129; --surface-2: #212a33; --ink: #e5ebf0; --muted: #9aa6b2; --line: #2e3945;
    --carbon: #a9b3be; --oxygen: #ff5d71; --iodine: #a88ee3; --iodine-soft: #2b2340;
    --action: #6ea7ff; --action-soft: #1d2d45; --on-action: #0f1a2b;
    --ok: #4cc38a; --ok-soft: #173327; --bad: #f0a04b; --bad-soft: #3a2a18;
    --glass: rgba(255,255,255,0.06); --glass-line: #8b98a5; --ice: rgba(110,170,225,0.16);
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --surface: #1a2129; --surface-2: #212a33; --ink: #e5ebf0; --muted: #9aa6b2; --line: #2e3945;
  --carbon: #a9b3be; --oxygen: #ff5d71; --iodine: #a88ee3; --iodine-soft: #2b2340;
  --action: #6ea7ff; --action-soft: #1d2d45; --on-action: #0f1a2b;
  --ok: #4cc38a; --ok-soft: #173327; --bad: #f0a04b; --bad-soft: #3a2a18;
  --glass: rgba(255,255,255,0.06); --glass-line: #8b98a5; --ice: rgba(110,170,225,0.16);
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
sub, sup { font-size: 0.72em; line-height: 0; }
sub { vertical-align: -0.28em; }
sup { vertical-align: 0.5em; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
.nw { white-space: nowrap; }
.mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 14px 56px; }

.top { display: flex; align-items: center; gap: 12px; padding: 16px 0 10px; }
.logo { flex: none; width: 34px; height: 40px; }
.titles { flex: 1; min-width: 0; }
.titles h1 { font-family: "Unbounded", "IBM Plex Sans", system-ui, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; margin: 0; }
.titles p { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
.lang { flex: none; display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 2px; }
.lang button { border: 0; background: none; padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.stack > * + * { margin-top: 12px; }
.field { display: block; margin: 0 0 4px; font-weight: 600; font-size: 15px; }
.input { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; background: var(--surface); font-size: 16px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; }
.seg button b { display: block; font-size: 15px; }
.seg button span { display: block; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { border-color: var(--action); box-shadow: inset 0 0 0 1px var(--action); background: var(--action-soft); }
.variant { font-size: 15px; background: var(--iodine-soft); border-radius: 10px; padding: 10px 12px; }
.variant b { color: var(--iodine); }
.btn { border: 0; border-radius: 11px; padding: 13px 16px; font-weight: 600; font-size: 16px; cursor: pointer; background: var(--action); color: var(--on-action); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.full { width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* status bar */
.status { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px; color: var(--muted); margin: 0 0 8px; }
.status b { color: var(--ink); font-weight: 600; }
.status .viol b { color: var(--bad); }
.ppe { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tog { border: 1.5px dashed var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; font-weight: 500; }
.tog[aria-pressed="true"] { border-style: solid; border-color: var(--ok); background: var(--ok-soft); color: var(--ink); }
.tog[aria-pressed="true"]::before { content: "✓ "; color: var(--ok); font-weight: 700; }

.bench { display: grid; grid-template-columns: 180px 1fr; gap: 14px; align-items: start; }
@media (max-width: 440px) { .bench { grid-template-columns: 138px 1fr; gap: 10px; } }
.bench svg { width: 100%; height: auto; display: block; }
.caption { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.reads { font-size: 13.5px; line-height: 1.4; margin: 0 0 8px; padding: 0; list-style: none; }
.reads li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding: 3px 0; }
.reads li span:last-child { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 13px; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; line-height: 1.35; }
.legend li { display: flex; gap: 8px; align-items: flex-start; }
.legend .sw { flex: none; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--glass-line); margin-top: 2px; }

.msgs { display: flex; flex-direction: column; gap: 6px; }
.msg { border-radius: 10px; padding: 9px 12px; font-size: 15px; border-left: 4px solid var(--action); background: var(--action-soft); }
.msg.warn { border-left-color: var(--bad); background: var(--bad-soft); }
.msg.good { border-left-color: var(--ok); background: var(--ok-soft); }
.msg.hint { border-left-color: var(--iodine); background: var(--iodine-soft); }
.msg .t { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--muted); margin-right: 6px; }

.grp h3 { font-size: 13.5px; color: var(--muted); font-weight: 500; margin: 0 0 6px; }
.grp + .grp { margin-top: 12px; }
.acts { display: flex; flex-wrap: wrap; gap: 7px; }
.act { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 15px; cursor: pointer; line-height: 1.3; text-align: left; }
.act.r { border-color: color-mix(in srgb, var(--oxygen) 45%, var(--line)); }
.act.o { border-color: color-mix(in srgb, var(--action) 45%, var(--line)); }
.act.p { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.act small { display: block; font-size: 12px; color: var(--muted); }
.act:disabled { opacity: .38; cursor: default; }
.act:not(:disabled):hover { background: var(--surface-2); }
.chooser { border: 2px solid var(--action); border-radius: 14px; padding: 14px 16px; background: var(--surface); }
.chooser h3 { margin: 0 0 10px; font-size: 16.5px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font-size: 15.5px; }
.opt input { margin-top: 4px; accent-color: var(--action); width: 18px; height: 18px; flex: none; }
.opt:has(input:checked) { border-color: var(--action); background: var(--action-soft); }
.sub { font-size: 14px; font-weight: 600; margin: 10px 0 6px; color: var(--muted); }

.aside { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.aside li { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14.5px; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.aside li .btn { padding: 7px 10px; font-size: 13.5px; flex: none; }
details.nb summary { cursor: pointer; font-weight: 600; font-size: 15px; }
.log { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; display: flex; flex-direction: column; gap: 6px; max-height: 360px; overflow-y: auto; }
.log li { border-bottom: 1px dashed var(--line); padding-bottom: 5px; }
.log .t { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--muted); margin-right: 6px; }
.log .w { color: var(--bad); }

/* report */
.rep h2 { font-family: "Unbounded", "IBM Plex Sans", system-ui, sans-serif; font-size: 20px; margin: 0 0 4px; }
.kv { list-style: none; padding: 0; margin: 10px 0 0; font-size: 15px; }
.kv li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.kv li span:last-child { font-weight: 600; text-align: right; }
.calc { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; margin-top: 10px; }
.calc .btn { padding: 11px 14px; }
.verdict { font-size: 14.5px; margin-top: 6px; }
.verdict.ok { color: var(--ok); font-weight: 600; }
.verdict.no { color: var(--bad); font-weight: 600; }
.tblwrap { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 460px; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--surface-2); }
.big { font-family: "Unbounded", "IBM Plex Sans", system-ui, sans-serif; font-size: 26px; font-weight: 700; line-height: 1.1; }

/* mistakes review */
.wr h2 { font-family: "Unbounded", "IBM Plex Sans", system-ui, sans-serif; font-size: 19px; margin: 0 0 4px; }
.wr .sum { color: var(--muted); font-size: 14.5px; margin: 0 0 12px; }
.lossbar { display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: var(--line); margin: 6px 0 8px; }
.lossbar i { display: block; height: 100%; }
.losslist { list-style: none; margin: 0 0 14px; padding: 0; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.losslist li { display: flex; gap: 8px; align-items: center; }
.losslist .sw { flex: none; width: 12px; height: 12px; border-radius: 3px; }
.losslist .pc { margin-left: auto; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 13px; }
.mist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mist li { border-radius: 10px; padding: 10px 12px; font-size: 14.5px; border-left: 4px solid var(--bad); background: var(--bad-soft); }
.mist li.safety { border-left-color: var(--oxygen); background: color-mix(in srgb, var(--oxygen) 10%, var(--surface)); }
.mist li.minor { border-left-color: var(--line); background: var(--surface-2); }
.mist li b { display: block; font-size: 15px; }
.mist .tag { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 99px; padding: 0 7px; margin-right: 6px; background: var(--surface); border: 1px solid var(--line); vertical-align: 1px; }
.mist .when { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--muted); }
.mist p { margin: 4px 0 0; }
.clean { border-left: 4px solid var(--ok); background: var(--ok-soft); border-radius: 10px; padding: 10px 12px; font-size: 15px; }

/* send code */
.send h2 { font-size: 17px; margin: 0 0 6px; }
.codebox { width: 100%; min-height: 96px; border: 1.5px dashed var(--action); border-radius: 10px; padding: 10px; font: 500 12.5px/1.45 "IBM Plex Mono", ui-monospace, Menlo, monospace; background: var(--surface-2); color: var(--ink); resize: none; word-break: break-all; margin-top: 8px; }
.copied { font-size: 14px; margin-top: 6px; min-height: 20px; }
.copied.ok { color: var(--ok); font-weight: 600; }
.copied.no { color: var(--bad); }

/* scene anim */
.anim .liq { animation: rise .55s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.heatw { animation: flick 1.2s ease-in-out infinite alternate; }
@keyframes flick { from { opacity: .5; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .anim .liq, .heatw { animation: none; } }
</style>
</head>

</div>

        var fix = fill(w.fix[lang] || w.fix.en, it.vars);
        var when = it.t != null ? '<span class="when">' + tr("at") + " " + clockStr(it.t) + (it.n > 1 ? ", " + tr("times", { n: it.n }) : "") + "</span>" : "";
        return '<li class="' + sev + '"><span class="tag">' + tr("tag_" + sev) + "</span>" + when + "<b>" + fmt(title) + "</b><p>" + fmt(fix) + (it.extra === "fixed" ? " <i>" + tr("fixed") + "</i>" : "") + "</p></li>";
      }).join("") + "</ul>";
    }
    return h + "</div>";
  }
  function fill(s, vars) { if (vars) Object.keys(vars).forEach(function (k) { s = s.split("{" + k + "}").join(vars[k]); }); return s; }

  var WKEYS = ["v_ppe", "v_hood_hcl", "v_hood_ether", "v_hood_ald", "v_cl2", "v_nocond", "v_etherheat", "v_etherwarm",
    "m_filt_lost", "m_hotwash", "m_filt_warm", "m_rec_exc", "m_rec_mn", "m_upper", "m_bis_ald", "m_kmno4_bnoh", "m_dilute", "m_redis",
    "m_sep_solid", "m_weigh_wet", "m_mp_wet", "m_nohe", "s_tol_left", "s_ald_left", "s_ext0", "s_ext1", "s_bz_left", "s_noph",
    "s_solid_left", "s_norec", "s_impure", "s_wet_final", "s_noweigh", "s_nomp", "s_noprod"];
  function fnv(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }
  function b64url(str) {
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function resultCode() {
    var r = analyze();
    var o = {
      v: 1, n: lab.name || "", r: lab.route, vol: lab.vol, m: lab.mass, mw: lab.massWet ? 1 : 0,
      mp: lab.mp ? [lab.mp[0], lab.mp[1], lab.mp[2] ? 1 : 0, lab.mp[3] ? 1 : 0] : null,
      q1: lab.calc.q1ok == null ? null : lab.calc.q1ok ? 1 : 0, q2: lab.calc.q2ok == null ? null : lab.calc.q2ok ? 1 : 0,
      t: Math.round(lab.clock), h: lab.hints,
      w: r.items.map(function (it) { return [WKEYS.indexOf(it.k), it.n || 0, it.extra === "fixed" ? 1 : 0]; }).filter(function (x) { return x[0] >= 0; }),
      lb: r.lb.parts.map(function (x) { return Math.round(x[1] / r.lb.th * 100); }),
      at: lab.finishedAt || Math.round(Date.now() / 60000)
    };
    var b = b64url(JSON.stringify(o));
    return "BZL1-" + b + "-" + ("00000000" + fnv("bzl-2026|" + b)).slice(-6);
  }
  function sendHtml() {
    var code = resultCode();
    var h = '<div class="card send" id="sendCard"><h2>' + tr("snd_t") + '</h2><p class="small" style="margin:0">' + tr("snd_p") + "</p>";
    if (!lab.name) h += '<p class="small" style="margin:10px 0 4px">' + tr("snd_name") + '</p><input class="input" id="nm2" type="text" autocomplete="name" placeholder="' + esc(tr("s_name_ph")) + '">';
    h += '<textarea class="codebox" id="codebox" readonly rows="4" aria-label="' + esc(tr("snd_t")) + '">' + esc(code) + '</textarea>' +
      '<button type="button" class="btn full" data-go="copy" style="margin-top:8px">' + tr("snd_copy") + '</button><div class="copied" id="copied" aria-live="polite"></div>' +
      '<p class="small muted" style="margin:6px 0 0">' + tr("snd_note") + "</p></div>";
    return h;
  }
  function copyCode() {
    var box = document.getElementById("codebox"), msg = document.getElementById("copied");
    if (!box) return;
    function ok() { msg.textContent = tr("snd_ok"); msg.className = "copied ok"; }
    function manual() { box.focus(); box.select(); try { box.setSelectionRange(0, box.value.length); } catch (e) {} msg.textContent = tr("snd_manual"); msg.className = "copied no"; }
    function legacy() {
      box.focus(); box.select(); try { box.setSelectionRange(0, box.value.length); } catch (e) {}
      var done = false; try { done = document.execCommand("copy"); } catch (e) { done = false; }
      if (done) ok(); else manual();
    }
    var settled = false;
    function once(fn) { return function () { if (settled) return; settled = true; fn(); }; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(box.value).then(once(ok), once(legacy));
      setTimeout(once(legacy), 1500);
    } else legacy();
  }

  function saveResult() {
    results[lab.route] = { mass: lab.mass, pct: lab.mass != null ? lab.mass / thYield() * 100 : null, mp: lab.mp, viol: Object.keys(lab.viol).length, at: Date.now() };
    store.set("vl-results", JSON.stringify(results));
  }

  /* =============== render & events =============== */
  var app = document.getElementById("app");
  function applyStatic() {
    document.documentElement.lang = lang; document.title = tr("title");
    document.querySelectorAll("[data-t]").forEach(function (el) { el.innerHTML = fmt(tr(el.getAttribute("data-t"))); });
    document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
  }
  function render(scroll) {
    if (ui.screen === "setup" || !lab) app.innerHTML = renderSetup();
    else if (ui.screen === "report") app.innerHTML = renderReport();
    else app.innerHTML = renderLab();
    ui.anim = false;
    if (scroll) { var el = document.getElementById(scroll); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" }); }
  }

  app.addEventListener("input", function (e) {
    if (e.target.id === "nm") {
      setup.name = e.target.value.slice(0, 80); store.set("vl-name", setup.name);
      var va = variantFor(setup.name, setup.route), vb = document.getElementById("varbox");
      if (vb) vb.querySelector("b").textContent = tr("var_" + setup.route, { v: num(va.vol, setup.route === "A" ? 2 : 1) });
    }
    if (e.target.id === "q1" || e.target.id === "q2") { lab.calc[e.target.id] = e.target.value; save(); }
    if (e.target.id === "nm2") {
      lab.name = e.target.value.slice(0, 80).trim(); save();
      var cb = document.getElementById("codebox"); if (cb) cb.value = resultCode();
    }
  });
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b || b.disabled) return;
    var d = b.dataset;
    if (d.route) { setup.route = d.route; store.set("vl-route", d.route); render(); return; }
    if (d.go === "start") { newLab(); ui.screen = "lab"; ui.chooser = null; render(); window.scrollTo({ top: 0 }); return; }
    if (d.go === "resume") { ui.screen = "lab"; render(); return; }
    if (d.go === "reset") {
      if (!ui.resetArmed) { ui.resetArmed = true; render(); setTimeout(function () { ui.resetArmed = false; if (ui.screen === "lab") render(); }, 3000); return; }
      ui.resetArmed = false; lab = null; save(); ui.screen = "setup"; render(); window.scrollTo({ top: 0 }); return;
    }
    if (d.go === "copy") { copyCode(); return; }
    if (d.go === "finish") { lab.finished = true; lab.finishedAt = Math.round(Date.now() / 60000); saveResult(); save(); ui.screen = "report"; render(); window.scrollTo({ top: 0 }); return; }
    if (d.go === "back") { lab.finished = false; save(); ui.screen = "lab"; render(); return; }
    if (d.go === "other") { setup.route = lab.route === "A" ? "B" : "A"; store.set("vl-route", setup.route); lab = null; save(); ui.screen = "setup"; render(); window.scrollTo({ top: 0 }); return; }
    if (d.ppe) { lab.ppe[d.ppe] = !lab.ppe[d.ppe]; save(); render(); return; }
    if (d.hood) { lab.hood = !lab.hood; save(); render(); return; }
    if (d.take !== undefined) { takeBack(+d.take); return; }
    if (d.r === "q1") {
      var x = parseNum(lab.calc.q1 || ""), th = thYield();
      lab.calc.q1ok = isFinite(x) && Math.abs(x - th) <= Math.max(0.01, th * 0.02); save(); render(); return;
    }
    if (d.r === "q2") {
      var y = parseNum(lab.calc.q2 || ""), pc = lab.mass / thYield() * 100;
      lab.calc.q2ok = isFinite(y) && Math.abs(y - pc) <= 1; saveResult(); save(); render(); return;
    }
    if (d.c) {
      if (d.c === "cancel") { ui.chooser = null; render(); return; }
      var box = document.getElementById("chooser");
      function val(n) { var el = box.querySelector('input[name="' + n + '"]:checked'); return el ? el.value : null; }
      var c = d.c; ui.chooser = null;
      if (c === "filter") filtrate(val("keep"), val("wash"));
      else if (c === "drain") drain(val("layer"));
      else recryst(val("amt"), box.querySelector('input[name="hf"]').checked);
      scrollMsgs(); return;
    }
    if (d.a) {
      var a = d.a;
      if (a === "hint") { lab.hints++; say(hintKey(), null, "hint"); commit(null, null, false, true); scrollMsgs(); return; }
      if (a === "filter" || a === "drain" || a === "recryst") { ui.chooser = a; render("chooser"); return; }
      if (PACT[a]) { PACT[a](lab.prod); scrollMsgs(); return; }
      if (ACT[a]) {
        if (lab.v && ["reflux", "shake", "ice", "cond", "ph", "room"].indexOf(a) < 0) { lab.v.heat = lab.v.heat === "ice" ? "ice" : null; if (lab.v.T > 20) lab.v.T -= (lab.v.T - 20) * 0.1; }
        ACT[a](lab.v); scrollMsgs();
      }
    }
  });
  function scrollMsgs() {
    var el = document.getElementById("benchCard");
    if (el && el.getBoundingClientRect().top < 0 && el.scrollIntoView) el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  }
  document.querySelector(".lang").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]"); if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang; store.set("vl-lang", lang); applyStatic(); render();
  });
  applyStatic();
  render();
})();
</script>
</body>
</html>
