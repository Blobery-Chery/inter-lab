<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Benzoic acid lab: pre-lab trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e9eff3; --surface: #ffffff; --surface-2: #f4f7f9; --ink: #1f252c; --muted: #5b6672; --line: #d2dbe2;
  --carbon: #4a525c; --oxygen: #d7263d; --iodine: #5b3e96; --iodine-soft: #ece6f7;
  --action: #1f5faf; --action-soft: #dde9f8; --on-action: #ffffff;
  --ok: #1e8a5a; --ok-soft: #dcf2e7; --bad: #a8480a; --bad-soft: #fbe9dc;
  --glass: rgba(255,255,255,0.7); --glass-line: #7f8d99; --heat: #e0662e; --ice: rgba(110,170,225,0.22); --ice-line: rgba(80,140,200,0.55);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --surface: #1a2129; --surface-2: #212a33; --ink: #e5ebf0; --muted: #9aa6b2; --line: #2e3945;
    --carbon: #a9b3be; --oxygen: #ff5d71; --iodine: #a88ee3; --iodine-soft: #2b2340;
    --action: #6ea7ff; --action-soft: #1d2d45; --on-action: #0f1a2b;
    --ok: #4cc38a; --ok-soft: #173327; --bad: #f0a04b; --bad-soft: #3a2a18;
    --glass: rgba(255,255,255,0.06); --glass-line: #8b98a5; --ice: rgba(110,170,225,0.16);
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --surface: #1a2129; --surface-2: #212a33; --ink: #e5ebf0; --muted: #9aa6b2; --line: #2e3945;
  --carbon: #a9b3be; --oxygen: #ff5d71; --iodine: #a88ee3; --iodine-soft: #2b2340;
  --action: #6ea7ff; --action-soft: #1d2d45; --on-action: #0f1a2b;
  --ok: #4cc38a; --ok-soft: #173327; --bad: #f0a04b; --bad-soft: #3a2a18;
  --glass: rgba(255,255,255,0.06); --glass-line: #8b98a5; --ice: rgba(110,170,225,0.16);
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
sub, sup { font-size: 0.72em; line-height: 0; }
sub { vertical-align: -0.28em; }
sup { vertical-align: 0.5em; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
.nw { white-space: nowrap; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 56px; }

.top { display: flex; align-items: center; gap: 12px; padding: 18px 0 12px; }
.logo { flex: none; width: 34px; height: 40px; }
.titles { flex: 1; min-width: 0; }
.titles h1 { font-family: "Unbounded", "IBM Plex Sans", system-ui, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; margin: 0; }
.titles p { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
.lang { flex: none; display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 2px; }
.lang button { border: 0; background: none; padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.tabs { padding: 6px 0 12px; }
.tabbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tabbar button { border: 0; background: none; border-radius: 9px; padding: 9px 4px; font-weight: 600; font-size: 14px; line-height: 1.25; color: var(--muted); cursor: pointer; }
.tabbar button[aria-selected="true"] { background: var(--action); color: var(--on-action); }
.panel[hidden] { display: none; }
.lead { color: var(--muted); margin: 2px 0 14px; font-size: 15px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 11px; padding: 9px 10px; text-align: left; cursor: pointer; }
.seg button b { display: block; font-size: 14.5px; }
.seg button span { display: block; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { border-color: var(--action); box-shadow: inset 0 0 0 1px var(--action); background: var(--action-soft); }
.seg .st { float: right; font-size: 12px; font-weight: 600; color: var(--ok); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.card + .card { margin-top: 12px; }
.meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13.5px; }
.meta .mist { color: var(--bad); font-weight: 600; }
.progress { height: 5px; background: var(--line); border-radius: 99px; margin: 8px 0 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--action); border-radius: 99px; transition: width .3s; }

.vessel { display: grid; grid-template-columns: minmax(150px, 190px) 1fr; gap: 14px; align-items: center; margin-top: 8px; }
@media (max-width: 420px) { .vessel { grid-template-columns: 150px 1fr; gap: 10px; } }
.vessel svg { width: 100%; height: auto; display: block; }
.caption { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; line-height: 1.35; }
.legend li { display: flex; gap: 8px; align-items: flex-start; }
.legend .sw { flex: none; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--glass-line); margin-top: 2px; }
.legend li.side { color: var(--muted); }
.legend li.side .sw { border-style: dashed; }
.mpread { font-family: "Unbounded", "IBM Plex Sans", system-ui, sans-serif; font-size: 24px; font-weight: 700; color: var(--ok); line-height: 1.15; }

.prompt { font-size: 17.5px; font-weight: 600; line-height: 1.4; margin: 0 0 10px; }
.shelf h3 { font-size: 13.5px; color: var(--muted); font-weight: 500; margin: 12px 0 6px; }
.shelf h3:first-child { margin-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 15px; cursor: pointer; line-height: 1.3; text-align: left; }
.chip.r { border-color: color-mix(in srgb, var(--oxygen) 45%, var(--line)); }
.chip.o { border-color: color-mix(in srgb, var(--action) 45%, var(--line)); }
.chip:not(:disabled):hover { background: var(--surface-2); }
.chip.tried { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); text-decoration: line-through; text-decoration-thickness: 1px; cursor: default; }
.choice { display: flex; flex-direction: column; gap: 8px; }
.choice .chip { border-radius: 11px; padding: 11px 14px; font-size: 16px; }

.whatif { margin-top: 12px; border-left: 4px solid var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.whatif strong { display: block; margin-bottom: 2px; }
.obs { border-left: 4px solid var(--ok); background: var(--ok-soft); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.obs strong { display: block; margin-bottom: 2px; }
.eqn { margin-top: 10px; font-size: 15.5px; line-height: 1.6; }
.redox { margin-top: 8px; font-size: 14.5px; padding: 8px 10px; border-radius: 8px; background: var(--iodine-soft); }
.redox b { color: var(--iodine); }
.why { margin: 8px 0 0; font-size: 14.5px; color: var(--muted); }
.btn { border: 0; border-radius: 11px; padding: 13px 16px; font-weight: 600; font-size: 16px; cursor: pointer; background: var(--action); color: var(--on-action); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.full { width: 100%; margin-top: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.row2 .btn { padding: 11px 8px; font-size: 15px; }

.done h2, .qcard h2.big { font-family: "Unbounded", "IBM Plex Sans", system-ui, sans-serif; font-size: 21px; margin: 0 0 6px; line-height: 1.25; }
.done h3 { font-size: 15.5px; margin: 16px 0 6px; }
.recap { margin: 0; padding-left: 22px; font-size: 15px; }
.recap li { margin-bottom: 3px; }
.mlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mlist li { background: var(--bad-soft); border-radius: 10px; padding: 9px 12px; font-size: 14.5px; }
.mlist li b { display: block; }

/* animation */
.anim .liq { animation: rise .6s ease-out both; }
.anim .liq:nth-of-type(2) { animation-delay: .08s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.heatw { animation: flick 1.2s ease-in-out infinite alternate; }
@keyframes flick { from { opacity: .55; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .anim .liq, .heatw { animation: none; } }

/* order */
.olist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ocard { width: 100%; text-align: left; display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; font-size: 15.5px; line-height: 1.4; }
.ocard .n { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1.5px dashed var(--line); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
.ocard.set { border-color: var(--action); }
.ocard.set .n { border: 0; background: var(--action); color: var(--on-action); }
.ocard.good { border-color: var(--ok); background: var(--ok-soft); cursor: default; }
.ocard.good .n { background: var(--ok); color: #fff; border: 0; }
.ocard.badpos { border-color: var(--bad); background: var(--bad-soft); cursor: default; }
.ocard.badpos .n { background: var(--bad); color: #fff; border: 0; }
.ocard .should { display: block; font-size: 13px; color: var(--bad); font-weight: 600; margin-top: 2px; }
.oscore { font-weight: 600; margin: 12px 0 0; }

/* test */
.qhead { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
.bar { height: 6px; background: var(--line); border-radius: 99px; margin: 8px 0 14px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--action); border-radius: 99px; transition: width .3s; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.qcard h2 { font-size: 18px; line-height: 1.4; margin: 0 0 14px; font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; font-size: 16px; }
.opt .mk { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; margin-top: 1px; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .mk { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .mk { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt.dim { opacity: .55; }
.explain { margin-top: 12px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.explain strong { display: block; }
.field { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 15px; }
.input { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; background: var(--surface); font-size: 16px; }
.rules { font-size: 14.5px; color: var(--muted); margin: 10px 0 0; padding-left: 20px; }
.admit { border: 2px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; background: var(--surface); }
.admit.yes { border-color: var(--ok); }
.admit.no { border-color: var(--bad); }
.admit .who { font-size: 20px; font-weight: 600; margin: 2px 0 0; }
.admit .when { color: var(--muted); font-size: 13.5px; }
.admit .status { font-family: "Unbounded", "IBM Plex Sans", system-ui, sans-serif; font-weight: 700; font-size: 22px; margin: 12px 0 8px; line-height: 1.2; }
.admit.yes .status { color: var(--ok); }
.admit.no .status { color: var(--bad); }
.checks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.checks li { display: flex; gap: 8px; }
.checks .ck { flex: none; font-weight: 700; width: 18px; }
.checks .y { color: var(--ok); }
.checks .n { color: var(--bad); }
.checks .i { color: var(--muted); }
.review { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.review li { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; }
.review li b { display: block; margin-bottom: 2px; }
.review .ans { color: var(--ok); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg class="logo" viewBox="0 0 34 40" aria-hidden="true">
      <path d="M12 3 L12 15 L3 33 Q1.5 37 6 37 L28 37 Q32.5 37 31 33 L22 15 L22 3" fill="none" stroke="var(--carbon)" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M7.2 26 L26.8 26 L30 32.6 Q31 35 28 35 L6 35 Q3 35 4 32.6 Z" fill="#7b2d8f"/>
      <line x1="9" y1="3" x2="25" y2="3" stroke="var(--carbon)" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <div class="titles">
      <h1 data-t="title"></h1>
      <p data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ru">RU</button>
    </div>
  </header>
  <nav class="tabs">
    <div class="tabbar" role="tablist">
      <button type="button" role="tab" id="tab-bench" aria-controls="p-bench" data-tab="bench" data-t="tab_bench"></button>
      <button type="button" role="tab" id="tab-order" aria-controls="p-order" data-tab="order" data-t="tab_order"></button>
      <button type="button" role="tab" id="tab-test" aria-controls="p-test" data-tab="test" data-t="tab_test"></button>
    </div>
  </nav>
  <section class="panel" id="p-bench" role="tabpanel" aria-labelledby="tab-bench"></section>
  <section class="panel" id="p-order" role="tabpanel" aria-labelledby="tab-order" hidden></section>
  <section class="panel" id="p-test" role="tabpanel" aria-labelledby="tab-test" hidden></section>
</div>

          { en: "Vacuum filtration only works in acid", ru: "Фильтрование под вакуумом работает только в кислоте" }],
      e: { en: "Two solids can't be separated by filtration. Hot conc. HCl with MnO₂ can also release chlorine.", ru: "Два осадка фильтрованием не разделить. К тому же горячая конц. HCl с MnO₂ может выделять хлор." } },
    { q: { en: "Why is a little NaHSO₃ added before filtering in Experiment 1?", ru: "Зачем в опыте 1 перед фильтрованием добавляют немного NaHSO₃?" },
      o: [{ en: "To destroy the excess KMnO₄, which would otherwise give toxic Cl₂ with HCl", ru: "Чтобы уничтожить избыток KMnO₄, иначе с HCl он даст ядовитый Cl₂" }, { en: "To neutralize the KOH", ru: "Чтобы нейтрализовать KOH" }, { en: "To dissolve the benzoic acid", ru: "Чтобы растворить бензойную кислоту" }, { en: "To speed up the oxidation", ru: "Чтобы ускорить окисление" }],
      e: { en: "Bisulfite reduces the leftover permanganate, so the filtrate is colourless and safe to acidify.", ru: "Бисульфит восстанавливает остаток перманганата: фильтрат бесцветный, и его безопасно подкислять." } },
    { q: { en: "Experiment 2: why is diethyl ether added after the reaction?", ru: "Опыт 2: зачем после реакции добавляют диэтиловый эфир?" },
      o: [{ en: "To extract benzyl alcohol while potassium benzoate stays in the water", ru: "Чтобы извлечь бензиловый спирт, а бензоат калия остался в воде" }, { en: "To oxidize the leftover benzaldehyde", ru: "Чтобы окислить остаток бензальдегида" }, { en: "To neutralize the KOH", ru: "Чтобы нейтрализовать KOH" }, { en: "To precipitate benzoic acid", ru: "Чтобы осадить бензойную кислоту" }],
      e: { en: "Benzyl alcohol dissolves in ether; the benzoate salt stays in the aqueous layer until you acidify it.", ru: "Бензиловый спирт растворяется в эфире, а соль бензоат остаётся в водном слое до подкисления." } },
    { q: { en: "In the separating funnel, where is the ether layer?", ru: "Где в делительной воронке эфирный слой?" },
      o: [{ en: "On top — ether is less dense than water", ru: "Сверху — эфир легче воды" }, { en: "At the bottom — ether is denser", ru: "Снизу — эфир тяжелее" }, { en: "There is only one layer", ru: "Слой только один" }, { en: "It depends on how much ether you add", ru: "Зависит от количества эфира" }],
      e: { en: "Diethyl ether has a density of about 0.71 g/mL, so it floats on the aqueous layer.", ru: "Плотность диэтилового эфира около 0,71 г/мл, поэтому он плавает над водным слоем." } },
    { q: { en: "Your benzoic acid melts at 114–119 °C. What do you conclude?", ru: "Ваша бензойная кислота плавится при 114–119 °C. Какой вывод?" },
      o: [{ en: "It's impure — recrystallize it again", ru: "Она загрязнена — нужна повторная перекристаллизация" }, { en: "It's pure benzoic acid", ru: "Это чистая бензойная кислота" }, { en: "It's benzyl alcohol", ru: "Это бензиловый спирт" }, { en: "The heating was too slow", ru: "Нагрев был слишком медленным" }],
      e: { en: "Pure benzoic acid melts sharply at 122–123 °C. Impurities lower and broaden the range.", ru: "Чистая бензойная кислота плавится чётко при 122–123 °C. Примеси понижают и растягивают интервал." } },
    { q: { en: "Why may you use only fresh, properly stored diethyl ether?", ru: "Почему можно использовать только свежий, правильно хранившийся диэтиловый эфир?" },
      o: [{ en: "Old ether can contain explosive peroxides", ru: "В старом эфире накапливаются взрывоопасные пероксиды" }, { en: "Old ether turns into an ester", ru: "Старый эфир превращается в сложный эфир" }, { en: "Old ether absorbs CO₂ and becomes acidic", ru: "Старый эфир поглощает CO₂ и становится кислым" }, { en: "Old ether loses its smell", ru: "Старый эфир теряет запах" }],
      e: { en: "Ethers slowly react with air at the α-C–H bond to form peroxides, which concentrate as the ether evaporates.", ru: "Эфиры медленно реагируют с воздухом по связи α-C–H и образуют пероксиды, которые концентрируются при испарении." } }
  ];
  var LET = ["A", "B", "C", "D"];
  var qs = null;
  var nameVal = store.get("bz-name") || "";
  function startTest() {
    qs = { perm: Q.map(function (q) { return shuffle(q.o.map(function (_, k) { return k; })); }), i: 0, score: 0, ans: [], done: false, at: null };
    var att = (parseInt(store.get("bz-attempts") || "0", 10) || 0) + 1;
    store.set("bz-attempts", String(att));
    qs.attempt = att;
  }
  function renderTest(focusNext) {
    var root = document.getElementById("p-test"), n = Q.length;
    if (!qs) {
      root.innerHTML = '<div class="qcard"><p style="margin:0">' + tr("t_lead") + '</p><label class="field" for="nm">' + tr("t_name") + '</label>' +
        '<input class="input" id="nm" type="text" autocomplete="name" placeholder="' + esc(tr("t_name_ph")) + '" value="' + esc(nameVal) + '">' +
        '<p class="field" style="margin-top:14px">' + tr("t_rules") + '</p><ul class="rules"><li>' + tr("t_rule1", { p: PASS, n: n }) + "</li><li>" + tr("t_rule2") + "</li></ul>" +
        '<button type="button" class="btn full" data-t-act="start">' + tr("t_start") + "</button></div>";
      return;
    }
    if (qs.done) { root.innerHTML = resultHtml(); return; }
    var q = Q[qs.i], perm = qs.perm[qs.i], chosen = qs.ans[qs.i], answered = chosen !== undefined;
    var h = '<div class="qhead"><span>' + tr("q_count", { i: qs.i + 1, n: n }) + "</span><span>" + tr("q_score", { s: qs.score }) + "</span></div>" +
      '<div class="bar"><i style="width:' + ((qs.i + (answered ? 1 : 0)) / n * 100) + '%"></i></div><div class="qcard"><h2>' + fmt(L(q.q)) + '</h2><div class="opts">' +
      perm.map(function (k, pos) {
        var c = "opt", mk = LET[pos];
        if (answered) { if (k === 0) { c += " right"; mk = "✓"; } else if (k === chosen) { c += " wrong"; mk = "✕"; } else c += " dim"; }
        return '<button type="button" class="' + c + '" data-opt="' + k + '"' + (answered ? " disabled" : "") + '><span class="mk">' + mk + "</span><span>" + fmt(L(q.o[k])) + "</span></button>";
      }).join("") + "</div>";
    if (answered) {
      h += '<div class="explain"><strong>' + (chosen === 0 ? tr("q_right") : tr("q_wrong")) + "</strong>" + fmt(L(q.e)) + "</div>" +
        '<button type="button" class="btn full" id="qnext" data-t-act="next">' + (qs.i === n - 1 ? tr("q_finish") : tr("q_next")) + "</button>";
    }
    root.innerHTML = h + "</div>";
    if (focusNext) { var nb = document.getElementById("qnext"); if (nb) { nb.focus({ preventScroll: true }); nb.scrollIntoView && nb.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" }); } }
  }
  function resultHtml() {
    var n = Q.length, pass = qs.score >= PASS, e1 = !!results.e1, e2 = !!results.e2, ok = pass && e1 && e2;
    var d = new Date(qs.at || Date.now());
    var when = d.toLocaleDateString(lang === "ru" ? "ru-RU" : "en-GB") + ", " + d.toLocaleTimeString(lang === "ru" ? "ru-RU" : "en-GB", { hour: "2-digit", minute: "2-digit" });
    function row(okv, text, sub) { return '<li><span class="ck ' + (okv ? "y" : "n") + '">' + (okv ? "✓" : "✕") + "</span><span>" + text + (sub ? ' <span style="color:var(--muted)">(' + sub + ")</span>" : "") + "</span></li>"; }
    var ordA = orderRes.e1 != null ? orderRes.e1 + "/" + ORDER.e1.length : tr("a_na"), ordB = orderRes.e2 != null ? orderRes.e2 + "/" + ORDER.e2.length : tr("a_na");
    var h = '<div class="admit ' + (ok ? "yes" : "no") + '"><div class="when">' + tr("a_card") + "</div>" +
      '<p class="who">' + (nameVal ? esc(nameVal) : '<span style="color:var(--muted)">' + tr("a_noname") + "</span>") + '</p><div class="when">' + when + " — " + tr("a_attempt", { k: qs.attempt }) + "</div>" +
      '<div class="status">' + (ok ? tr("a_yes") : tr("a_no")) + '</div><ul class="checks">' +
      row(pass, tr("a_test", { s: qs.score, n: n, p: PASS })) +
      row(e1, tr("a_e1"), e1 ? tr("a_e_m", { m: results.e1.mistakes }) : tr("a_notdone")) +
      row(e2, tr("a_e2"), e2 ? tr("a_e_m", { m: results.e2.mistakes }) : tr("a_notdone")) +
      '<li><span class="ck i">·</span><span>' + fmt(tr("a_order", { a: ordA, b: ordB })) + "</span></li></ul>" +
      '<p style="margin:12px 0 0;font-size:14px;color:var(--muted)">' + (ok ? tr("a_show") : tr("a_fix")) + "</p></div>";
    var miss = Q.map(function (q, i) { return { q: q, i: i }; }).filter(function (x) { return qs.ans[x.i] !== 0; });
    if (miss.length) {
      h += '<h3 style="margin:18px 0 0;font-size:16px">' + tr("q_review") + '</h3><ul class="review">' + miss.map(function (x) {
        return "<li><b>" + fmt(L(x.q.q)) + '</b><span class="ans">' + tr("q_ans") + " " + fmt(L(x.q.o[0])) + "</span><br>" + fmt(L(x.q.e)) + "</li>";
      }).join("") + "</ul>";
    }
    return h + '<button type="button" class="btn full ghost" data-t-act="retake">' + tr("a_retake") + "</button>";
  }
  document.getElementById("p-test").addEventListener("input", function (e) {
    if (e.target.id === "nm") { nameVal = e.target.value.slice(0, 80); store.set("bz-name", nameVal); }
  });
  document.getElementById("p-test").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b || b.disabled) return;
    var a = b.dataset.tAct;
    if (a === "start") { startTest(); renderTest(); return; }
    if (b.dataset.opt !== undefined && qs && qs.ans[qs.i] === undefined) {
      var k = +b.dataset.opt; qs.ans[qs.i] = k; if (k === 0) qs.score++; renderTest(true); return;
    }
    if (a === "next") {
      if (qs.i === Q.length - 1) { qs.done = true; qs.at = Date.now(); } else qs.i++;
      renderTest();
      var top = document.getElementById("p-test").getBoundingClientRect().top + window.pageYOffset - 12;
      window.scrollTo({ top: Math.max(0, top), behavior: reduceMotion ? "auto" : "smooth" });
    } else if (a === "retake") { qs = null; renderTest(); }
  });

  /* ---------------- shell ---------------- */
  var tab = store.get("bz-tab") || "bench";
  if (["bench", "order", "test"].indexOf(tab) < 0) tab = "bench";
  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = tr("title");
    document.querySelectorAll("[data-t]").forEach(function (el) { el.innerHTML = fmt(tr(el.getAttribute("data-t"))); });
    document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
  }
  function setTab(t) {
    tab = t; store.set("bz-tab", t);
    document.querySelectorAll(".tabbar button").forEach(function (b) { var on = b.dataset.tab === t; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; });
    ["bench", "order", "test"].forEach(function (p) { document.getElementById("p-" + p).hidden = p !== t; });
    if (t === "test" && (!qs || qs.done)) renderTest();
    if (t === "bench") renderBench();
  }
  function renderAll() { applyStatic(); renderBench(); renderOrder(); renderTest(); }
  document.querySelector(".tabbar").addEventListener("click", function (e) { var b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });
  document.querySelector(".tabbar").addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var tabs = ["bench", "order", "test"], i = (tabs.indexOf(tab) + (e.key === "ArrowRight" ? 1 : 2)) % 3;
    setTab(tabs[i]); document.querySelector('.tabbar button[data-tab="' + tabs[i] + '"]').focus();
  });
  document.querySelector(".lang").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang; store.set("bz-lang", lang); renderAll();
  });
  renderAll();
  setTab(tab);
})();
</script>
</body>
</html>
