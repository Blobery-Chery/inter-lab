/* ===== pH: баланс зарядов для м-нитробензойной кислоты (pKa 3,45; растворимость ≈0,015 М) ===== */
const KA=10**-3.45,SOL=0.015,KW=1e-14;
function pHcalc(net,Cm,V){const n=net/V,c=Cm/V,F=x=>n+x-KA*c/(KA+x)-KW/x;let lo=-15,hi=1.5;
 for(let i=0;i<70;i++){const m=(lo+hi)/2;if(F(10**m)>0)hi=m;else lo=m}let x=10**((lo+hi)/2),ppt=0;
 if(c*x/(KA+x)>SOL){x=(-n+Math.sqrt(n*n+4*(KA*SOL+KW)))/2;ppt=Math.max(0,c-SOL-KA*SOL/x)*V}return{pH:-Math.log10(x),ppt}}
function pHcolor(p){const st=[[0,[200,30,50]],[2,[230,60,50]],[4,[245,140,40]],[5,[245,200,50]],[7,[110,180,40]],[9,[30,150,130]],[11,[50,90,170]],[14,[90,40,130]]];p=clamp(p,0,14);
 for(let i=1;i<st.length;i++){if(p<=st[i][0]){const[a,ca]=st[i-1],[b,cb]=st[i],u=(p-a)/(b-a);return `rgb(${ca.map((v,j)=>Math.round(v+(cb[j]-v)*u)).join(',')})`}}return 'rgb(90,40,130)'}

function ring(cx,cy,r,subs){const V=[];for(let i=0;i<6;i++){const a=(-90+60*i)*Math.PI/180;V.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}
 let p=`<polygon points="${V.map(v=>v.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.6"/><circle cx="${cx}" cy="${cy}" r="${r*.58}" fill="none" stroke="var(--ink)" stroke-width="1.2"/>`;
 for(const k in subs){const i=+k,[x,y]=V[i],a=(-90+60*i)*Math.PI/180,c=Math.cos(a),s=Math.sin(a);p+=`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(cx+(r+13)*c).toFixed(1)}" y2="${(cy+(r+13)*s).toFixed(1)}" stroke="var(--ink)" stroke-width="1.6"/><text class="lblb" x="${(cx+(r+17)*c).toFixed(1)}" y="${(cy+(r+17)*s+4).toFixed(1)}" text-anchor="${c>.3?'start':c<-.3?'end':'middle'}">${subs[k]}</text>`}return p}

/* ===== Весы (общий контроллер) / balance controller ===== */
function balanceUI(o){const sp=o.mode==='spatula',base=sp?168:172;
 const b={boat:false,tare:0,pw:0,open:true,bm:sp?rnd(.82,.87):rnd(21.3,24.8),done:false};
 const disp=()=>{const v=(b.boat?b.bm:0)+b.pw-b.tare+(b.open?rnd(-6e-4,6e-4):rnd(-4e-5,4e-5));q('balD').textContent=f(v,4)+' g';q('balStab').setAttribute('opacity',b.open?.2:1);
  q('door').setAttribute('stroke-dasharray',b.open?'4 3':'none');q('doorT').textContent=b.open?L('дверца открыта','door open'):L('дверца закрыта','door closed');setPile(b.pw,!sp,base)};
 const boatB=B(P(o.boatLabel),()=>{if(b.boat)return;b.boat=true;vis(q(sp?'boat':'glassDish'),true);boatB.disabled=true;log(o.boatLog);disp()});
 const tareB=B(L('Тарировать → 0','Tare → 0'),()=>{b.tare=(b.boat?b.bm:0)+b.pw;b.tared=b.boat&&b.pw===0;log(tx('Весы тарированы','Balance tared'));disp()});
 const doorB=B(L('Закрыть дверцы','Close the doors'),()=>{b.open=!b.open;doorB.textContent=b.open?L('Закрыть дверцы','Close the doors'):L('Открыть дверцы','Open the doors');disp()});
 const can=()=>{if(b.done)return false;if(!b.boat){remark('pan',tx('вещество насыпали прямо на чашку весов','substance was put straight onto the balance pan'),1);fb(L('Вещество нельзя насыпать прямо на чашку весов — поставьте лодочку.','Never put a substance straight onto the pan — use a weighing boat.'),'bad');return false}
  if(!b.open){fb(L('Дверцы закрыты — откройте их, чтобы работать шпателем.','The doors are closed — open them to use the spatula.'),'warn');return false}return true};
 const rows=[lab(L('Весы','Balance')),row(boatB,tareB,doorB)];
 if(sp)rows.push(lab(L('Шпатель','Spatula')),row(B(L('Насыпать шпателем','Add a spatula load'),()=>{if(can()){b.pw+=rnd(.22,.42);disp()}}),B(L('Подсыпать чуть-чуть','Add a pinch'),()=>{if(can()){b.pw+=rnd(.006,.03);disp()}}),
  B(L('Отсыпать излишек','Remove the excess'),()=>{if(can()&&b.pw>0){b.pw=Math.max(0,b.pw-rnd(.01,.05));if(b.pw<.004)b.pw=0;disp();log(tx('Излишек отсыпан в отдельный стаканчик (в банку с реактивом не возвращают)','Excess moved to a separate beaker (never back into the reagent jar)'))}})));
 else rows.push(lab(L('Продукт','Product')),row(B(L('Перенести весь продукт','Transfer all the product'),()=>{if(!b.boat){fb(L('Сначала поставьте часовое стекло.','Place the watch glass first.'),'warn');return}if(!b.open){fb(L('Откройте дверцы весов.','Open the balance doors.'),'warn');return}if(b.pw)return;b.pw=o.mass;disp();log(tx('Продукт перенесён на часовое стекло','Product transferred onto the watch glass'))})));
 const rec=B(L('Записать массу','Record the mass'),()=>{if(b.done)return;if(!b.boat||b.pw<=0){fb(L('На весах нет вещества.','There is nothing on the balance.'),'warn');return}
  if(!b.tared){remark('tare',tx('взвешивание без тарирования пустой тары','weighing without taring the empty container'),.5);fb(L('На дисплее не масса вещества: весы тарированы не с пустой тарой. ','The display does not show the mass of the substance: the balance was not tared with an empty container. ')+(sp?L('Отсыпьте вещество до нуля, тарируйте весы с пустой лодочкой и взвесьте снова.','Remove the substance, tare with the empty boat and weigh again.'):L('Тарируйте весы с пустым стеклом.','Tare with the empty watch glass.')),'warn');if(!sp){b.pw=0;disp()}return}
  if(b.open){fb(L('Закройте дверцы весов — при открытых дверцах показания «плывут».','Close the balance doors — with the doors open the reading drifts.'),'warn');return}
  const m=+b.pw.toFixed(4);if(o.lo&&(m<o.lo||m>o.hi)){fb(L(`Масса ${f(m,4)} г вне допустимого интервала ${f(o.lo,2)}–${f(o.hi,2)} г.`,`The mass ${f(m,4)} g is outside the allowed ${f(o.lo,2)}–${f(o.hi,2)} g.`),'warn');return}
  b.done=true;rec.disabled=true;q('balD').textContent=f(m,4)+' g';fb(L(`Записано в журнал: <b>${f(m,4)} г</b>`,`Recorded in the notebook: <b>${f(m,4)} g</b>`),'good');o.onRecord(m)},'pri');
 rows.push(row(rec));C().append(...rows);disp();return loop(()=>{if(!b.done)disp()},350)}

STEPS.push({stage:'e1',title:['Растворение в серной кислоте','Dissolving in sulfuric acid'],
 instr:[`<ol><li>В вытяжном шкафу отмерьте цилиндром <b>5 мл</b> конц. H₂SO₄ (96–98 %, d 1,84).</li><li>Прилейте кислоту к бензойной кислоте в колбе и перемешайте стеклянной палочкой.</li></ol><p class="note">Излишек реактива в склянку не возвращают — только в ёмкость для отходов.</p>`,

 run(){let v=0,st=0;setFlask(0,S.mBA);const ml=L('мл','mL'),g=L('г','g');
  const upd=()=>{setCyl(v);RO([[L('Цилиндр','Cylinder'),f(v,1)+' '+ml,Math.abs(v-5)<.05?'ok':v>5?'warn':''],[L('Колба','Flask'),st?f(S.vAcid,1)+' '+ml+' H₂SO₄ + '+f(S.mBA,2)+' '+g:f(S.mBA,2)+' '+g+' C₆H₅COOH']])};
  const add=d=>B(`+${f(d,1)} ${ml}`,()=>{if(st)return;v=+Math.min(10,v+d).toFixed(1);upd()});
  const sub=bt=>B(bt?L('Отлить 0,5 мл обратно в склянку','Pour 0.5 mL back into the bottle'):L('Отлить 0,5 мл в отходы','Pour 0.5 mL into the waste'),()=>{if(st||v<=0)return;v=+Math.max(0,v-.5).toFixed(1);
   if(bt)remark('bottle',tx('излишек реактива вернули в склянку — так загрязняют реактив','excess reagent returned to the bottle — this contaminates the reagent'),1);else log(tx('Излишек H₂SO₄ слит в ёмкость для кислотных отходов','Excess H₂SO₄ poured into the acid waste container'));upd()});
  const pourB=B(L('Перелить в колбу','Pour into the flask'),()=>{if(st)return;if(v<.5){fb(L('Цилиндр пуст.','The cylinder is empty.'),'warn');return}
   if(Math.abs(v-5)>.25)remark('vol',tx(`объём H₂SO₄ отмерен неточно (${f(v,1)} мл вместо 5 мл)`,`inaccurate volume of H₂SO₄ (${f(v,1)} mL instead of 5 mL)`),.5);
   S.vAcid=v;st=1;v=0;pourB.disabled=true;adv(60);setFlask(S.vAcid+.4,S.mBA*.75);log(tx(`К бензойной кислоте прилито ${f(S.vAcid,1)} мл конц. H₂SO₄`,`${f(S.vAcid,1)} mL of conc. H₂SO₄ added to the benzoic acid`));upd()});
  const stirB=B(L('Перемешать палочкой','Stir with the rod'),()=>{if(st!==1){fb(st?L('Уже перемешано.','Already stirred.'):L('Сначала прилейте кислоту.','Add the acid first.'),'warn');return}st=2;stirB.disabled=true;vis(q('rodG'),true);q('rod').classList.add('stir');

 if(pts.length){c.strokeStyle=col('--accent');c.lineWidth=2;c.beginPath();pts.forEach(([t,T],i)=>i?c.lineTo(X(t),Y(T)):c.moveTo(X(t),Y(T)));c.stroke();

 const d=clamp(.006+N.E/12000,0,.35),ox=clamp(N.E/30000,0,.2),nN=n*conv*(1-ox),keep=1-S.pour.loss-S.filt.tloss;
 const c={meta:Math.max(.05,nN*(1-d)*.80*M.NBA*keep-S.filt.loss),ortho:nN*(1-d)*.185*M.NBA*keep*.7,para:nN*(1-d)*.015*M.NBA*keep,di:nN*d*M.DNBA*keep,ba:n*(1-conv)*M.BA*keep*.9,d};
 c.acid=S.filt.pH<2.5?.06:.008;c.org=c.meta+c.ortho+c.para+c.di+c.ba;c.tot=c.org*(1+c.acid);S.crude=c}
function makeFin(){const c=S.crude,R=S.rec,imp=R.full?1:3,meta=Math.max(.05,c.meta-R.V*(R.shock?.0022:.0024)-.04);
 const o={meta,ortho:c.ortho*.05*imp*(R.shock?1.6:1),para:c.para*.45,di:c.di*.3*imp*(R.shock?1.3:1),ba:Math.max(0,c.ba-R.V*.0017)*.6*imp,acid:c.acid*.1*c.org};
 o.m=o.meta+o.ortho+o.para+o.di+o.ba+o.acid;o.purity=o.meta/o.m;S.fin=o}

STEPS.push({stage:'e2',title:['Реакция с хлоридом железа(III)','Reaction with iron(III) chloride'],

   const sH=Lh*(1-fr)*(sin?.92:1),lH=Lh*.8*fr,cs=q('capS'),cl=q('capL');cl.setAttribute('y',200-lH);cl.setAttribute('height',lH);cs.setAttribute('y',200-lH-sH);cs.setAttribute('height',sH);cs.setAttribute('opacity',fr>0?.85:1);
